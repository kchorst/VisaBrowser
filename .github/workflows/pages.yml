name: Validate and deploy VisaBrowser
on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch Wikipedia rule data before deploying
        type: boolean
        default: false
  schedule:
    - cron: "23 10 * * 2"

concurrency:
  group: visabrowser-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/validate.py
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_acceptance.py

  deploy:
    if: ${{ github.repository == 'kchorst/VisaBrowser' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.VISABROWSER_ENABLE_REFRESH == 'true')) }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - if: ${{ github.event_name == 'schedule' || inputs.refresh }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: ${{ github.event_name == 'schedule' || inputs.refresh }}
        run: |
          pip install -r scripts/requirements.txt
          python scripts/refresh.py
          python scripts/build_offline.py
          python scripts/validate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Wikipedia visa rules"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

  release:
    if: ${{ github.repository == 'kchorst/VisaBrowser' && github.ref_type == 'tag' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"
          grep -Fx "export const version = '$version';" site/version.js
          git archive --format=zip --prefix=VisaBrowser/ --output=VisaBrowser-Windows.zip HEAD
          gh release create "$GITHUB_REF_NAME" VisaBrowser-Windows.zip --verify-tag --generate-notes --title "VisaBrowser $GITHUB_REF_NAME"
