name: Validate and deploy VisaBrowser
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch Wikipedia rule data before deploying
        type: boolean
        default: false
  schedule:
    - cron: "23 10 * * 2"

concurrency:
  group: visabrowser-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  # A new main commit supersedes an unshipped build; avoid a queue of stale releases.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/validate.py
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_acceptance.py

  deploy:
    if: ${{ github.repository == 'kchorst/VisaBrowser' && github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.VISABROWSER_ENABLE_REFRESH == 'true')) }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - if: ${{ github.event_name == 'schedule' || inputs.refresh }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: ${{ github.event_name == 'schedule' || inputs.refresh }}
        run: |
          pip install -r scripts/requirements.txt
          python scripts/refresh.py
          python scripts/build_offline.py
          python scripts/validate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Wikipedia visa rules"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed website and release version
        run: |
          version="$(node -p "require('./package.json').version")"
          url="${{ steps.deployment.outputs.page_url }}"
          url="${url%/}/"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 15 "${url}version.js" | grep -Fx "export const version = '$version';" &&
               curl -fsSL --max-time 15 "${url}index.html" | grep -q '<title>VisaBrowser</title>'; then
              echo "Verified ${url} and v${version}"
              exit 0
            fi
            sleep 10
          done
          echo "Deployed website could not be verified with the expected version" >&2
          exit 1

  release:
    if: ${{ github.repository == 'kchorst/VisaBrowser' && github.ref_name == github.event.repository.default_branch && github.event_name == 'push' }}
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - name: Package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          grep -Fx "export const version = '$version';" site/version.js
          tag="v$version"
          git archive --format=zip --prefix=VisaBrowser/ --output=VisaBrowser-Windows.zip HEAD
          unzip -t VisaBrowser-Windows.zip >/dev/null
          unzip -Z1 VisaBrowser-Windows.zip | grep -Fx 'VisaBrowser/Start-VisaBrowser.bat'
          unzip -Z1 VisaBrowser-Windows.zip | grep -Fx 'VisaBrowser/site/index.html'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; preserving existing published asset."
            exit 0
          fi
          gh release create "$tag" VisaBrowser-Windows.zip --target "$GITHUB_SHA" --generate-notes --title "VisaBrowser $tag"
          gh release view "$tag" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
      - name: Confirm release asset and publish verified status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fx 'VisaBrowser-Windows.zip'
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="VisaBrowser/v$version-release" \
            -f description="Pages deployment verified; Windows ZIP release published" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
