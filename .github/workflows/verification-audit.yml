name: VisaBrowser verification priority audit
on:
  pull_request:
    paths:
      - 'scripts/verification_queue.py'
      - 'docs/verification/**'
      - '.github/workflows/verification-audit.yml'
      - 'tests/test_verification_queue.py'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verification_queue.py'
      - 'docs/verification/**'
      - '.github/workflows/verification-audit.yml'
  schedule:
    - cron: "47 11 * * 3"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deduplicated risk-ranked verification queue
        run: python scripts/verification_queue.py --output audit-output
      - name: Run priority scoring and completeness tests
        run: python -m unittest discover -s tests -p 'test_verification_queue.py'
      - name: Publish downloadable complete and top-500 queues
        uses: actions/upload-artifact@v4
        with:
          name: VisaBrowser-verification-queue
          path: audit-output/
          retention-days: 90
