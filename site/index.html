<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="Compare tourist entry requirements for a group of travelers.">
  <title>VisaBrowser</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img width="38" height="38" src="./icon-192.png" alt="">
      <a class="brand-home" href="#home" aria-label="VisaBrowser — go to Home">VisaBrowser</a>
      <span id="version"></span>
      <button type="button" id="save-offline" hidden>Save offline</button>
    </div>
  </header>
  <div class="layout">
    <p class="muted" id="visa-data-date" hidden></p>
    <p class="muted" id="offline-status" role="status" hidden></p>
    <div id="storage-alert" role="alert" hidden></div>
    <main id="main" tabindex="-1" aria-busy="true"><p class="panel" role="status">Loading VisaBrowser…</p></main>
    <footer><a href="https://github.com/kchorst/VisaBrowser/releases/latest">Download latest</a> <span>·</span> <a href="https://en.wikipedia.org/wiki/Category:Visa_requirements_by_nationality">Wikipedia sources</a> <span>·</span> <a href="https://creativecommons.org/licenses/by-sa/4.0/">Adapted under CC BY-SA 4.0</a></footer>
  </div>
  <noscript>Enable JavaScript to compare tourist entry requirements.</noscript>
</body>
</html>
